[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bilge"
version = "0.2.0"
description = "Bilge: a Turkish instruction-following assistant fine-tuned with QLoRA, with data cleaning and measurable evaluation."
authors = [{ name = "Şule Özdamar" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1", "transformers>=4.44.0", "peft>=0.12.0", "accelerate>=0.33.0", "datasets>=2.20.0", "pyyaml",
]

[project.optional-dependencies]
gpu = ["bitsandbytes>=0.43.0"]
demo = ["gradio>=4.44.0"]
hub = ["huggingface_hub"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905"]
